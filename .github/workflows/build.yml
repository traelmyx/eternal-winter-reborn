name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [1.21.1-fabric, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run server GameTests
        run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:build
      - name: Server GameTests in a production launch (Fabric)
        if: endsWith(matrix.node, '-fabric')
        run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:runProductionGameTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/
            versions/${{ matrix.node }}/build/gametest-report.xml
            versions/${{ matrix.node }}/build/run/gameTest/logs/
            versions/${{ matrix.node }}/build/run/gameTest/crash-reports/
            versions/${{ matrix.node }}/build/run/prodGameTest/logs/
          if-no-files-found: ignore

  client:
    name: client ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [1.21.1-fabric, 1.21.1-neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Client gametest
        run: |
          args="--stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:runProductionClientGameTest"
          case "${{ matrix.node }}" in
            *-neoforge) xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew $args ;;
            *) ./gradlew $args ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/run/prodClientGameTest/screenshots/
            versions/${{ matrix.node }}/build/run/prodClientGameTest/logs/
            versions/${{ matrix.node }}/build/run/prodClientGameTest/crash-reports/
            versions/${{ matrix.node }}/build/run/clientSmoke/screenshots/
            versions/${{ matrix.node }}/build/run/clientSmoke/logs/
            versions/${{ matrix.node }}/build/run/clientSmoke/crash-reports/
          if-no-files-found: ignore

  # Does the snow show up for players on a dedicated server, with and without the mod on their client?
  multiplayer-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build the mod
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-neoforge:jar
      - name: Start a NeoForge dedicated server with the mod
        run: |
          mkdir -p server && cd server
          nf=$(grep '^deps.neoforge=' ../versions/1.21.1-neoforge/gradle.properties | cut -d= -f2)
          curl -sSfLo installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$nf/neoforge-$nf-installer.jar"
          $JAVA_HOME_21_X64/bin/java -jar installer.jar --installServer > install.log
          mkdir -p mods && cp ../versions/1.21.1-neoforge/build/libs/eternalwinter-*-neoforge.jar mods/
          rm -f mods/*-sources.jar
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-seed=20261016\nspawn-protection=0\n' > server.properties
          sed -i "s#^java #$JAVA_HOME_21_X64/bin/java #" run.sh || true
          (PATH=$JAVA_HOME_21_X64/bin:$PATH ./run.sh nogui > server.out 2>&1 &)
          for i in $(seq 1 180); do grep -q 'Done (' server.out 2>/dev/null && break; sleep 2; done
          grep 'Done (' server.out
          echo 'weather rain 100000' > /dev/null
      - name: Client with the mod
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-neoforge:runProbeModded
      - name: Client without the mod
        if: always()
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-neoforge:runProbeVanilla
      - name: Results
        if: always()
        run: cat versions/1.21.1-neoforge/build/run/probe*/probe-*.txt; tail -20 server/server.out
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: multiplayer-probe
          path: |
            versions/1.21.1-neoforge/build/run/probe*/probe-*.txt
            versions/1.21.1-neoforge/build/run/probe*/screenshots/
            versions/1.21.1-neoforge/build/run/probe*/logs/
            server/server.out
            server/logs/
          if-no-files-found: ignore

  # The same check on Fabric: a Fabric server with the mod, joined by Fabric clients with and without it
  multiplayer-probe-fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build the mod and the probe
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-fabric:remapJar :1.21.1-fabric:remapProbeJar
      - name: Start a Fabric dedicated server with the mod
        run: |
          mkdir -p fserver/mods && cd fserver
          loader=$(grep '^loader_version=' ../gradle.properties | cut -d= -f2)
          api=$(grep '^deps.fabric_api=' ../versions/1.21.1-fabric/gradle.properties | cut -d= -f2)
          curl -sSfLo server.jar "https://meta.fabricmc.net/v2/versions/loader/1.21.1/$loader/1.1.0/server/jar"
          curl -sSfLo mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$api/fabric-api-$api.jar"
          cp $(ls ../versions/1.21.1-fabric/build/libs/eternalwinter-*-fabric.jar | grep -v -e sources -e probe -e gametest) mods/
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-seed=20261016\n' > server.properties
          ($JAVA_HOME_21_X64/bin/java -Xmx2G -jar server.jar nogui > server.out 2>&1 &)
          for i in $(seq 1 240); do grep -q 'Done (' server.out 2>/dev/null && break; sleep 2; done
          grep 'Done (' server.out
      - name: Client with the mod
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-fabric:runProbeModded
      - name: Client without the mod
        if: always()
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :1.21.1-fabric:runProbeVanilla
      - name: Results
        if: always()
        run: cat versions/1.21.1-fabric/build/run/probe*/probe-*.txt; tail -20 fserver/server.out
